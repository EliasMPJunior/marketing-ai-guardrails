statechart:
  name: Marketing operation
  description: >
    Stub of the validation loop described in the README: a marketing brief is
    interpreted, validated against policy and consent, turned into campaign
    content, revalidated against evidence, and published only after human
    approval. Correction, rejection, and escalation are explicit paths.
  preamble: |
    # Verified facts produced by capabilities and independent checks. The
    # statechart only verifies them; it never establishes them itself.
    is_brief_structured = setdefault("is_brief_structured", False)
    is_audience_verified = setdefault("is_audience_verified", False)
    is_offer_compliant = setdefault("is_offer_compliant", False)
    are_claims_grounded = setdefault("are_claims_grounded", False)
    review_decision = setdefault("review_decision", None)
    # Bound on how many times a task listing may be split and rescored, so the
    # loop through operation_split cannot run (and spend tokens) forever.
    max_split_rounds = setdefault("max_split_rounds", 1)
    split_rounds = setdefault("split_rounds", 0)

  root state:
    name: root
    initial: brief_received
    states:
      - name: brief_received
        # Entry action: runs the objective input checks from
        # states/brief_received/guard.py and records the resulting fact.
        on entry: is_prompt_valid = check_prompt()
        transitions:
          - target: brief_structured
            guard: is_prompt_valid
            # Transition action: the brief is structured only when the prompt
            # was valid and the interpretation capability succeeded.
            action: is_brief_structured = is_prompt_valid and interpret_brief()
          - target: rejected
            guard: not is_prompt_valid

      - name: brief_structured
        contract:
          - before: is_brief_structured
        transitions:
          - target: operation_scored
            guard: is_brief_structured
            action: is_operation_scored = is_brief_structured and score_tasks()

      - name: operation_scored
        contract:
          - before: is_operation_scored
        # Entry action: runs the score threshold check from
        # states/operation_scored/guard.py and records the resulting fact.
        on entry: |
          is_operation_validated = check_single_strong_steps()
          is_operation_splittable = check_strong_steps()
        transitions:
          - target: operation_validated
            guard: is_operation_validated
          # At least one strong step per task, but some tasks have several.
          - target: operation_split
            guard: is_operation_splittable and not is_operation_validated and split_rounds < max_split_rounds
            action: |
              split_rounds += 1
              is_operation_split = split_tasks()
          # Some task has no strong step, or splitting did not resolve them.
          - target: operation_unresolved
            guard: not is_operation_validated and (not is_operation_splittable or split_rounds >= max_split_rounds)
            action: alert_human_tasks()

      - name: operation_split
        contract:
          - before: is_operation_split
        transitions:
          - target: tasks_replaced
            guard: is_operation_split
            action: is_tasks_replaced = replace_tasks()

      - name: tasks_replaced
        contract:
          - before: is_tasks_replaced
        transitions:
          # Back to scoring: the new tasks need their own step scores.
          - target: operation_scored
            guard: is_tasks_replaced
            action: is_operation_scored = score_tasks()

      - name: operation_validated
        contract:
          - before: is_operation_validated
        transitions:
          - target: published
            guard: is_operation_validated

      - name: published
        type: final
        contract:
          - before: is_operation_validated

      - name: operation_unresolved
        type: final

      - name: rejected
        type: final
